name: Auto Close Issues

on:
  issues:
    types: [opened]

jobs:
  close_and_comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment and Close Issue
        uses: actions/github-script@v6
        with:
          script: |
            const repo = context.repo;
            const issueNumber = context.payload.issue.number;

            // シンプルな自動返信のコメント（英語 / 日本語）
            const commentBody = `Thank you for your feedback. We will consider it for future development.

ご意見ありがとうございます。今後の開発の参考にさせていただきます。`;

            // コメントの投稿
            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });

            // Issueを即座にクローズ
            await github.rest.issues.update({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
