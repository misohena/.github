name: Feedback Box (No replies) / ご意見箱
description: Feedback or bug reports / ご意見や不具合報告はこちら
body:
  - type: markdown
    attributes:
      value: |
        This issue will be automatically closed unconditionally. Replies will generally not be provided. I may address the reported issue when I have free time, I may not, or I may even do the exact opposite.

        Issueは無条件で自動的にクローズされます。基本的に返信はしません。頂いたIssueは暇なときに修正するかもしれませんし、しないかもしれませんし、真逆の修正をするかもしれません。
  - type: textarea
    id: content
    attributes:
      label: Content
      placeholder: Thank you for your feedback. We will consider it for future development.
    validations:
      required: true
