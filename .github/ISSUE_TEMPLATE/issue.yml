name: Feedback Box (No replies) / ご意見箱
description: Feedback or bug reports / ご意見や不具合報告はこちら
body:
  - type: markdown
    attributes:
      value: |
        Issues will be closed after a while. Replies will generally not be provided. I may address the reported issue when I have free time, I may not, or I may even do the exact opposite.

        Issueはしばらくした後クローズされます。基本的に返信はしません。頂いたIssueは暇なときに修正するかもしれませんし、しないかもしれませんし、真逆の修正をするかもしれません。
  - type: textarea
    id: content
    attributes:
      label: Content
    validations:
      required: true
